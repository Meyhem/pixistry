name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # No npm run test:e2e here on purpose, matching CLAUDE.md: typecheck +
      # unit tests are the real gate, e2e is a manual pre-landing check, not
      # a CI gate. It's also not viable as one on this shared 2-core runner
      # -- headless Chromium + SwiftShader software WebGL + the sim's worker
      # thread starves for CPU here, so the exact same suite that's a solid
      # ~30s locally takes 9-13 minutes and times out across most of
      # apparatus.spec.ts on every single run this repo has ever pushed.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
